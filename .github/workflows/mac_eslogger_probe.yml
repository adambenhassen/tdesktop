name: macOS Endpoint Security probe

on:
  pull_request:
    paths:
      - Telegram/build/probe_mac_eslogger.py
      - Telegram/build/test_probe_mac_eslogger.py
      - .github/workflows/mac_eslogger_probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry-probe:
    name: Endpoint Security sensitivity probe
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test probe evidence filtering
        run: python3 -m unittest Telegram/build/test_probe_mac_eslogger.py

      - name: Run non-gating telemetry probe
        run: python3 Telegram/build/probe_mac_eslogger.py --evidence-dir "$RUNNER_TEMP/mac-eslogger-probe"

      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: mac-eslogger-probe
          path: |
            ${{ runner.temp }}/mac-eslogger-probe/summary.json
            ${{ runner.temp }}/mac-eslogger-probe/fixture.json
          if-no-files-found: error
