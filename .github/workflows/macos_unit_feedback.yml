name: MacOS unit feedback.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, full commit SHA, or SHA prefix of the dispatch revision.
        required: true
        default: dev
        type: string
      repeat_count:
        description: Number of full unit-suite runs (1-500).
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:

  unit:
    name: macOS arm64 unit-only feedback
    runs-on: macos-latest
    timeout-minutes: 180

    env:
      PREPARE_PATH: Telegram/build/prepare/prepare.py

    steps:
      - name: Validate repeat count.
        id: repeat-count
        env:
          REPEAT_COUNT: ${{ inputs.repeat_count }}
        run: |
          set -euo pipefail

          if [[ ! "$REPEAT_COUNT" =~ ^[1-9][0-9]{0,2}$ ]]; then
            echo "::error::repeat_count must be an integer from 1 through 500."
            exit 1
          fi

          repeat_count=$((10#$REPEAT_COUNT))
          if (( repeat_count > 500 )); then
            echo "::error::repeat_count must be an integer from 1 through 500."
            exit 1
          fi

          echo "repeat_count=$repeat_count" >> "$GITHUB_OUTPUT"

      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"

      - name: Report runner architecture.
        run: |
          echo "uname -m: $(uname -m)"
          echo "cpu: $(sysctl -n machdep.cpu.brand_string)"
          test "$(uname -m)" = "arm64" || {
            echo "::error::Runner is $(uname -m), not arm64."
            exit 1
          }

      - name: Resolve checkout ref.
        id: checkout-ref
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          resolve_checkout_ref() {
            local requested_ref="$1"
            if [[ "$requested_ref" =~ ^[[:xdigit:]]{7,39}$ ]] \
                && [[ "$GITHUB_SHA" == "$requested_ref"* ]]; then
              printf '%s\n' "$GITHUB_SHA"
            else
              printf '%s\n' "$requested_ref"
            fi
          }

          test_ref="${GITHUB_SHA:0:10}"
          if [[ "$(resolve_checkout_ref "$test_ref")" != "$GITHUB_SHA" ]]; then
            echo "::error::Short SHA resolution self-test failed."
            exit 1
          fi

          echo "ref=$(resolve_checkout_ref "$REQUESTED_REF")" >> "$GITHUB_OUTPUT"

      - name: Clone.
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.checkout-ref.outputs.ref }}
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          sudo chown -R `whoami`:admin /usr/local/share

          brew update
          brew upgrade || true
          brew install automake libtool meson nasm ninja pkg-config

          sudo mdutil -a -i off
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Libraries.
        id: libraries
        run: ./$REPO_NAME/Telegram/build/prepare/mac.sh skip-release silent

      - name: Free up some disk space.
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      - name: Save libraries cache.
        if: ${{ !cancelled() && steps.libraries.outcome == 'success' && steps.cache-libs.outputs.cache-hit != 'true' && github.ref == 'refs/heads/dev' && inputs.ref == 'dev' }}
        uses: actions/cache/save@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}

      - name: Record tested revision.
        run: echo "TESTED_SHA=$(git -C "$REPO_NAME" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build unit tests.
        run: |
          cd "$REPO_NAME/Telegram"

          ./configure.sh \
            -D CMAKE_OSX_ARCHITECTURES=arm64 \
            -D CMAKE_CONFIGURATION_TYPES=Debug \
            -D CMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D TDESKTOP_API_TEST=ON \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

          cmake --build ../out --config Debug --target test_unit --parallel

      - name: Unit tests.
        id: stress
        env:
          REQUESTED_REPEAT_COUNT: ${{ steps.repeat-count.outputs.repeat_count }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/test_unit_stress.log"
          iteration_log="$RUNNER_TEMP/test_unit_iteration.log"
          iterations="$RUNNER_TEMP/test_unit_iterations.txt"
          : > "$log"
          : > "$iterations"

          completed=0
          first_failure=""
          for ((iteration = 1; iteration <= REQUESTED_REPEAT_COUNT; iteration++)); do
            printf '=== iteration %s/%s: start ===\n' \
              "$iteration" "$REQUESTED_REPEAT_COUNT" | tee -a "$log"
            : > "$iteration_log"

            set +e
            "$REPO_NAME/out/Debug/test_unit" > "$iteration_log" 2>&1
            test_status=$?
            set -e
            cat "$iteration_log" | tee -a "$log"
            completed=$((completed + 1))

            summary="$(sed -nE \
              's/^([0-9]+) case\(s\), ([0-9]+) failed, ([0-9]+) failed check\(s\)\.$/\1 \2 \3/p' \
              "$iteration_log" | tail -n 1)"
            failure_reason=""
            iteration_result="iteration=$iteration exit=$test_status"
            if [[ -z "$summary" ]]; then
              failure_reason="missing case summary"
              iteration_result="$iteration_result summary=missing"
            else
              read -r cases failed failed_checks <<< "$summary"
              iteration_result="$iteration_result cases=$cases failed=$failed failed_checks=$failed_checks"
              if (( 10#$cases == 0 )); then
                failure_reason="zero cases"
              elif (( 10#$failed != 0 )); then
                failure_reason="failed cases"
              elif (( 10#$failed_checks != 0 )); then
                failure_reason="failed checks"
              fi
            fi

            if (( test_status != 0 )); then
              if [[ -n "$failure_reason" ]]; then
                failure_reason="$failure_reason; test_unit exited $test_status"
              else
                failure_reason="test_unit exited $test_status"
              fi
            fi
            if ! grep -Eq '^run[[:space:]]+LocalDiscoveryFailsOverToLaterResolvedAddress$' "$iteration_log"; then
              if [[ -n "$failure_reason" ]]; then
                failure_reason="$failure_reason; discovery case did not start"
              else
                failure_reason="discovery case did not start"
              fi
            elif ! grep -Eq '^ok[[:space:]]+LocalDiscoveryFailsOverToLaterResolvedAddress$' "$iteration_log"; then
              if [[ -n "$failure_reason" ]]; then
                failure_reason="$failure_reason; discovery case did not pass"
              else
                failure_reason="discovery case did not pass"
              fi
            fi

            if [[ -n "$failure_reason" ]]; then
              first_failure=$iteration
              iteration_result="$iteration_result result=failed reason=$failure_reason"
            else
              iteration_result="$iteration_result result=passed"
            fi
            printf '%s\n' "$iteration_result" | tee -a "$iterations" "$log"
            printf '=== iteration %s/%s: end ===\n' \
              "$iteration" "$REQUESTED_REPEAT_COUNT" | tee -a "$log"

            if [[ -n "$first_failure" ]]; then
              break
            fi
          done

          {
            echo "## macOS unit stress feedback"
            echo
            echo "- Revision: \`$TESTED_SHA\`"
            echo "- Requested repeats: $REQUESTED_REPEAT_COUNT"
            echo "- Completed repeats: $completed"
            echo "- First failing iteration: ${first_failure:-none}"
            if [[ -n "$first_failure" ]]; then
              echo "- Result: failed"
            else
              echo "- Result: passed"
            fi
            echo
            echo "Iteration results:"
            echo '```text'
            cat "$iterations"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "completed_repeat_count=$completed"
            echo "first_failure_iteration=$first_failure"
          } >> "$GITHUB_OUTPUT"

          if [[ -n "$first_failure" ]]; then
            exit 1
          fi

      - name: Upload unit stress logs.
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-unit-stress-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/test_unit_stress.log
            ${{ runner.temp }}/test_unit_iterations.txt
          if-no-files-found: warn
          retention-days: 14
