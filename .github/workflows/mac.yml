name: MacOS.

on:
  # Fork policy: per-push CI is Linux only. macOS builds on demand or for a release tag.
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  macos:
    name: MacOS
    permissions:
      contents: write
    # This fork cannot schedule a depot label, and a build that queues forever
    # is not a build. macos-latest is Apple Silicon, which is what we ship.
    runs-on: macos-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        variant: ["non-store"]
    env:
      BUILD_VARIANT: ${{ matrix.variant }}
      UPLOAD_ARTIFACT: ${{ matrix.variant == 'non-store' && 'true' || 'false' }}
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Report runner architecture.
        run: |
          echo "uname -m: $(uname -m)"
          echo "cpu: $(sysctl -n machdep.cpu.brand_string)"
          test "$(uname -m)" = "arm64" || {
            echo "::error::Runner is $(uname -m), not arm64; this lane only produces Apple Silicon builds."
            exit 1
          }

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
          path: ${{ env.REPO_NAME }}

      - name: Initialize workflow evidence.
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -Eeuo pipefail
          evidence="$REPO_NAME/out/Debug/evidence"
          mkdir -p "$evidence"
          printf 'tested_sha=%s\nvariant=%s\n' "$GITHUB_SHA" "$BUILD_VARIANT" > "$evidence/run.txt"

      - name: Verify Teagram identity contract.
        run: bash "$REPO_NAME/Telegram/build/test_mac_identity.sh" "$REPO_NAME" identity

      - name: First set up.
        run: |
          sudo chown -R `whoami`:admin /usr/local/share

          brew update
          brew upgrade || true
          brew install automake libtool meson nasm ninja pkg-config
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            brew install clang-format
          fi

          # Disable spotlight.
          sudo mdutil -a -i off

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake

      - name: Verify Mac App Store variant is unsupported.
        id: store_variant_rejection
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -Eeuo pipefail
          evidence="$REPO_NAME/out/Debug/evidence"
          mkdir -p "$evidence"
          rejection_build="$RUNNER_TEMP/teagram-macstore-rejection"
          rejection_log="$evidence/macstore-rejection.log"
          set +e
          cmake -S "$REPO_NAME" -B "$rejection_build" \
            -D DESKTOP_APP_SPECIAL_TARGET:STRING=macstore \
            -D CMAKE_OSX_ARCHITECTURES=arm64 \
            > "$rejection_log" 2>&1
          rejection_status=$?
          set -e
          cat "$rejection_log"
          if [ "$rejection_status" -eq 0 ] \
            || ! grep -Fq 'Mac App Store builds are unsupported by Teagram.' "$rejection_log"; then
            echo "::error::Mac App Store configuration was not rejected by Teagram's build guard."
            exit 1
          fi
          printf 'tested_sha=%s\nvariant=build_macstore\nresult=unsupported\nconfigure_exit_status=%s\n' \
            "$GITHUB_SHA" "$rejection_status" \
            > "$evidence/macstore-rejection-status.txt"

      - name: Check changed C++ formatting.
        id: source-format
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          evidence="$REPO_NAME/out/Debug/evidence"
          log="$evidence/source-format.log"
          clang-format --version > "$log" 2>&1
          git -C "$REPO_NAME" diff --no-ext-diff --unified=0 --no-color origin/dev...HEAD \
            -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.m' '*.mm' \
            > "$RUNNER_TEMP/changed-cpp.diff"
          set +e
          python3 - "$REPO_NAME" "$RUNNER_TEMP/changed-cpp.diff" >> "$log" 2>&1 <<'PY'
          import re
          import subprocess
          import sys
          from collections import defaultdict
          from pathlib import Path

          root, diff_path = sys.argv[1:]
          changed = defaultdict(list)
          current = None
          with open(diff_path, encoding="utf-8") as source:
              for line in source:
                  if line.startswith("+++ b/"):
                      current = line[6:].strip()
                  elif line.startswith("@@") and current:
                      match = re.search(r"\+(\d+)(?:,(\d+))?", line)
                      if match:
                          first = int(match.group(1))
                          count = int(match.group(2) or "1")
                          if count:
                              changed[current].append((first, first + count - 1))

          if not changed:
              print("No changed C++ source lines were found; skipping format check.")
              sys.exit(0)

          style = (
              "{BasedOnStyle: LLVM, UseTab: Always, IndentWidth: 4, TabWidth: 4, "
              "ContinuationIndentWidth: 4, ColumnLimit: 80, SortIncludes: false, "
              "BreakBeforeBinaryOperators: All, "
              "NamespaceIndentation: None}"
          )
          failed = False
          for relative, ranges in sorted(changed.items()):
              command = ["clang-format", "--dry-run", "--Werror", f"--style={style}"]
              for first, last in ranges:
                  command.append(f"--lines={first}:{last}")
              command.append(str(Path(root, relative)))
              result = subprocess.run(command, text=True, capture_output=True)
              print(f"Checking {relative}")
              if result.stdout:
                  print(result.stdout, end="")
              if result.stderr:
                  print(result.stderr, end="", file=sys.stderr)
              failed |= result.returncode != 0

          sys.exit(1 if failed else 0)
          PY
          format_status=$?
          set -e
          printf 'tested_sha=%s\nvariant=%s\nexit_status=%s\n' \
            "$GITHUB_SHA" "$BUILD_VARIANT" "$format_status" \
            > "$evidence/source-format-status.txt"
          cat "$log"
          exit "$format_status"

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Libraries.
        id: libraries
        run: |
          ./$REPO_NAME/Telegram/build/prepare/mac.sh skip-release silent

      - name: Free up some disk space.
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      # Saved only from the default branch. Every other ref reads that entry
      # instead of writing its own: the fork's Actions cache is already over
      # its 10 GB budget and evicting, and any other copy of this tree would
      # evict the entry the whole fork builds against. A tag ref would be the
      # worst of those, since its cache is scoped to the tag and no branch,
      # including dev, can ever restore it.
      # Placed before the build step, so an hour of dependency work is not
      # thrown away when the client code that follows fails to compile.
      # !cancelled() rather than always(): under cancel-in-progress a
      # cancellation can land mid-trim, and this key is immutable, so a
      # half-trimmed tree would be the one every later run restores.
      - name: Save libraries cache.
        if: ${{ !cancelled() && steps.libraries.outcome == 'success' && steps.cache-libs.outputs.cache-hit != 'true' && github.ref == 'refs/heads/dev' }}
        uses: actions/cache/save@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}

      - name: Teagram build.
        id: build
        if: env.ONLY_CACHE == 'false'
        run: |
          set -Eeo pipefail
          BUILD_LOG="$RUNNER_TEMP/teagram-build-${BUILD_VARIANT}.log"
          cd "$REPO_NAME/Telegram"

          BUILD_ARGS=()
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            BUILD_ARGS+=(-D TDESKTOP_MAC_PROTECTED_PATH_INTEGRATION_TEST=ON)
          fi

          # cmake/validate_special_target.cmake defaults this to "x86_64;arm64",
          # so the inherited build spent half its compile time on a slice no one
          # here can run. The prepared Libraries are universal, so linking an
          # arm64-only client against them needs nothing else.
          configure_status=0
          ./configure.sh \
          -D CMAKE_OSX_ARCHITECTURES=arm64 \
          -D CMAKE_CONFIGURATION_TYPES=Debug \
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON \
          -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -D TDESKTOP_API_TEST=ON \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF \
          "${BUILD_ARGS[@]}" 2>&1 | tee "$BUILD_LOG" || configure_status=$?
          if [ "$configure_status" -ne 0 ]; then
            echo "::error::Teagram configure failed for variant=$BUILD_VARIANT exit_status=$configure_status; see the retained build log."
            exit "$configure_status"
          fi

          grep -F 'DESKTOP_APP_DISABLE_AUTOUPDATE:BOOL=ON' ../out/CMakeCache.txt
          build_status=0
          cmake --build ../out --config Debug --parallel 2>&1 | tee -a "$BUILD_LOG" || build_status=$?
          if [ "$build_status" -ne 0 ]; then
            echo "::error::Teagram build failed for variant=$BUILD_VARIANT exit_status=$build_status; see the retained build log."
            exit "$build_status"
          fi

      - name: Verify artifact architecture.
        id: artifact-verification
        if: env.ONLY_CACHE == 'false'
        run: |
          set -Eeuo pipefail
          cd $REPO_NAME/out/Debug
          mkdir -p evidence
          evidence_dir="$PWD/evidence"
          static_failure() {
            code=$?
            trap - EXIT
            if [ "$code" -ne 0 ]; then
              printf 'FAIL: static artifact verification exit_code=%s command=%s\n' "$code" "${BASH_COMMAND:-unknown}" > "$evidence_dir/status.txt"
            fi
            exit "$code"
          }
          trap static_failure EXIT
          grep -F 'DESKTOP_APP_DISABLE_AUTOUPDATE:BOOL=ON' ../CMakeCache.txt | tee evidence/cmake-cache-autoupdate.txt
          app=Teagram.app
          plist="$app/Contents/Info.plist"
          executable="$app/Contents/MacOS/Teagram"
          plutil -p "$plist" | tee evidence/plist.txt
          test "$(plutil -extract CFBundleExecutable raw -o - "$plist")" = Teagram
          test "$(plutil -extract CFBundleName raw -o - "$plist")" = Teagram
          test "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = io.teagram.desktop
          if plutil -extract CFBundleURLTypes xml1 -o - "$plist" >/dev/null 2>&1; then
            echo "CFBundleURLTypes must be absent from $plist"
            exit 1
          fi
          test ! -e "$app/Contents/Frameworks/Updater"
          test ! -e Updater
          test ! -e "$app/Contents/Helpers/Updater"
          if find "$app" -type f -perm -111 -iname 'Updater' -print -quit | grep -q .; then
            echo "recursive updater search found an executable"
            exit 1
          fi
          for binary in "$executable"; do
            echo "== $binary"
            file "$binary"
            archs=$(lipo -archs "$binary")
            echo "lipo -archs: $archs"
            test "$archs" = "arm64" || {
              echo "::error::$binary is '$archs', expected arm64."
              exit 1
            }
          done | tee evidence/architecture-static.txt

      - name: Run isolation observer self-tests (informational).
        if: ${{ always() && env.UPLOAD_ARTIFACT == 'true' }}
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          evidence="$REPO_NAME/out/Debug/evidence"
          mkdir -p "$evidence"
          bash "$REPO_NAME/Telegram/build/test_mac_identity.sh" "$REPO_NAME" observer \
            2>&1 | tee "$evidence/observer-self-tests.txt"

      - name: Run protected profile and IPC integration tests.
        id: profile-ipc
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -Eeuo pipefail
          evidence="$REPO_NAME/out/Debug/evidence"
          state="$(mktemp -d "$RUNNER_TEMP/teagram-profile-ipc-${BUILD_VARIANT}.XXXXXX")"
          trap 'rm -rf "$state"' EXIT
          mkdir -p "$state/home" "$state/tmp"
          executable="$REPO_NAME/out/Debug/Teagram.app/Contents/MacOS/Teagram"
          set +e
          env HOME="$state/home" TMPDIR="$state/tmp" \
            TDESKTOP_MAC_PROFILE_TEST_TMP_BASE="$state/tmp" \
            bash "$REPO_NAME/Telegram/build/test_mac_profile_guard.sh" \
              "$executable" \
            2>&1 | tee "$evidence/profile-ipc-${BUILD_VARIANT}.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          test_status="${statuses[0]}"
          tee_status="${statuses[1]}"
          if [ "$test_status" -ne 0 ]; then
            cp -R "$state" "$evidence/profile-ipc-${BUILD_VARIANT}-state"
          elif [ "$tee_status" -ne 0 ]; then
            test_status="$tee_status"
            echo "::error::Could not retain profile/IPC integration logs for variant=$BUILD_VARIANT."
          fi
          printf 'tested_sha=%s\nvariant=%s\nexit_status=%s\n' \
            "$GITHUB_SHA" "$BUILD_VARIANT" "$test_status" \
            > "$evidence/profile-ipc-${BUILD_VARIANT}-status.txt"
          {
            printf '### Protected profile and IPC: %s\n\n' "$BUILD_VARIANT"
            printf -- '- Tested SHA: `%s`\n- Exit status: `%s`\n' \
              "$GITHUB_SHA" "$test_status"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"

      - name: Summarize on-demand validation.
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        env:
          FORMAT_OUTCOME: ${{ steps.source-format.outcome }}
          STORE_REJECTION_OUTCOME: ${{ steps.store_variant_rejection.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact-verification.outcome }}
          PROFILE_IPC_OUTCOME: ${{ steps.profile-ipc.outcome }}
        run: |
          set -Eeuo pipefail
          {
            printf '### macOS Teagram validation: %s\n\n' "$BUILD_VARIANT"
            printf -- '- Tested SHA: `%s`\n- C++ format check: `%s`\n' \
              "$GITHUB_SHA" "$FORMAT_OUTCOME"
            printf -- '- Mac App Store rejection check: `%s`\n- Build: `%s`\n- Artifact verification: `%s`\n- Profile/IPC harness: `%s`\n' \
              "$STORE_REJECTION_OUTCOME" "$BUILD_OUTCOME" "$ARTIFACT_OUTCOME" "$PROFILE_IPC_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve on-demand failure logs.
        if: ${{ always() && github.event_name == 'workflow_dispatch' && steps.build.outcome == 'failure' }}
        run: |
          set -Eeuo pipefail
          evidence="$REPO_NAME/out/Debug/evidence"
          mkdir -p "$evidence"
          build_log="$RUNNER_TEMP/teagram-build-${BUILD_VARIANT}.log"
          if [ -f "$build_log" ]; then
            cp "$build_log" "$evidence/build-${BUILD_VARIANT}.log"
          fi

      - name: Classify Teagram artifact publication.
        if: always()
        run: |
          set -u
          evidence="$REPO_NAME/out/Debug/evidence"
          mkdir -p "$evidence"
          ready=false
          if [ "${{ steps.build.outcome }}" = "success" ] \
            && [ "${{ steps.artifact-verification.outcome }}" = "success" ] \
            && [ "$UPLOAD_ARTIFACT" = "true" ]; then
            ready=true
          fi
          printf 'artifact_ready=%s\n' "$ready" > "$evidence/artifact-publication.txt"
          echo "ARTIFACT_READY=$ready" >> "$GITHUB_ENV"

      - name: Move artifact.
        if: always() && env.UPLOAD_ARTIFACT == 'true' && env.ARTIFACT_READY == 'true'
        run: |
          cd $REPO_NAME/out/Debug
          mkdir artifact
          if [ -d Teagram.app ]; then
            mv Teagram.app artifact/
          fi
      - uses: actions/upload-artifact@v7
        if: always() && env.UPLOAD_ARTIFACT == 'true' && env.ARTIFACT_READY == 'true'
        name: Upload artifact.
        with:
          name: Teagram-macOS-arm64
          path: ${{ env.REPO_NAME }}/out/Debug/artifact/
          if-no-files-found: error

      - name: Package release asset.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && env.ARTIFACT_READY == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          artifact_dir="$REPO_NAME/out/Debug/artifact"
          asset_tag="${RELEASE_TAG//\//-}"
          asset_name="Teagram-macOS-arm64-${asset_tag}.zip"
          (
            cd "$artifact_dir"
            zip -r "../$asset_name" Teagram.app
          )
          release_asset="$REPO_NAME/out/Debug/$asset_name"
          release_asset_sha256="$(shasum -a 256 "$release_asset" | awk '{print $1}')"
          echo "RELEASE_ASSET=$release_asset" >> "$GITHUB_ENV"
          echo "RELEASE_ASSET_SHA256=$release_asset_sha256" >> "$GITHUB_ENV"
          printf 'release_asset_sha256=%s\n' "$release_asset_sha256" \
            > "$REPO_NAME/out/Debug/evidence/release-asset-sha256.txt"

      - name: Save Teagram evidence.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Teagram-macOS-arm64-evidence
          path: ${{ env.REPO_NAME }}/out/Debug/evidence/
          if-no-files-found: warn

      - name: Publish GitHub release.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && env.ARTIFACT_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ASSET_SHA256: ${{ env.RELEASE_ASSET_SHA256 }}
        run: |
          set -euo pipefail
          notes=$(printf 'Tag: %s\nCommit: %s\nArchive SHA-256: %s\n\nThis app is unsigned and must be opened once via right-click > Open.' "$RELEASE_TAG" "$RELEASE_SHA" "$RELEASE_ASSET_SHA256")
          release_repo="$GITHUB_REPOSITORY"
          is_prerelease=false
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            is_prerelease=true
          fi

          if ! gh release view "$RELEASE_TAG" --repo "$release_repo" >/dev/null 2>&1; then
            create_args=(--verify-tag --draft)
            if [[ "$is_prerelease" == true ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$release_repo" \
              --title "$RELEASE_TAG" \
              --notes "$notes" \
              "${create_args[@]}"
          elif [[ "$(gh release view "$RELEASE_TAG" --repo "$release_repo" --json isDraft --jq .isDraft)" != true ]]; then
            echo "Refusing to update an already-published release." >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" \
            --repo "$release_repo" \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --repo "$release_repo" \
            --title "$RELEASE_TAG" \
            --notes "$notes" \
            --draft

      - name: Require on-demand validation checks.
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        env:
          FORMAT_OUTCOME: ${{ steps.source-format.outcome }}
          STORE_REJECTION_OUTCOME: ${{ steps.store_variant_rejection.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact-verification.outcome }}
          PROFILE_IPC_OUTCOME: ${{ steps.profile-ipc.outcome }}
        run: |
          set -Eeuo pipefail
          failed=false
          for check in \
            "C++ format=$FORMAT_OUTCOME" \
            "Mac App Store rejection=$STORE_REJECTION_OUTCOME" \
            "build=$BUILD_OUTCOME" \
            "artifact verification=$ARTIFACT_OUTCOME" \
            "profile/IPC harness=$PROFILE_IPC_OUTCOME"; do
            printf '%s\n' "$check"
            case "$check" in
              *'=success') ;;
              *)
                echo "::error::Required on-demand check did not pass: $check"
                failed=true
                ;;
            esac
          done
          [[ "$failed" == false ]]
