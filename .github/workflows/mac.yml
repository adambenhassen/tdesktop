name: MacOS.

on:
  # Fork policy: per-push CI is Linux only. macOS builds on demand or for a release tag.
  workflow_dispatch:
    inputs:
      auth_regression_sha:
        description: Candidate PR head SHA to exercise using its existing successful arm64 app artifact.
        required: false
        type: string
      auth_regression_build_run_id:
        description: Successful MacOS workflow run ID that built auth_regression_sha.
        required: false
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validate-auth-regression-inputs:
    name: Validate macOS regression inputs
    runs-on: ubuntu-latest
    steps:
      - name: Require a matching candidate SHA and app run.
        env:
          CANDIDATE_SHA: ${{ inputs.auth_regression_sha }}
          BUILD_RUN_ID: ${{ inputs.auth_regression_build_run_id }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            test -z "$CANDIDATE_SHA"
            test -z "$BUILD_RUN_ID"
            exit 0
          fi

          if [[ -n "$CANDIDATE_SHA" ]] && [[ -n "$BUILD_RUN_ID" ]]; then
            [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::auth_regression_sha must be a full 40-character commit SHA."
              exit 1
            }
            [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::auth_regression_build_run_id must be a positive run ID."
              exit 1
            }
          elif [[ -n "$CANDIDATE_SHA" ]] || [[ -n "$BUILD_RUN_ID" ]]; then
            echo "::error::Provide both auth_regression_sha and auth_regression_build_run_id."
            exit 1
          fi

  macos:
    name: MacOS
    needs: validate-auth-regression-inputs
    if: ${{ needs.validate-auth-regression-inputs.result == 'success' && (github.event_name != 'workflow_dispatch' || (!inputs.auth_regression_sha && !inputs.auth_regression_build_run_id)) }}
    permissions:
      contents: write
    # This fork cannot schedule a depot label, and a build that queues forever
    # is not a build. macos-latest is Apple Silicon, which is what we ship.
    runs-on: macos-latest
    timeout-minutes: 180

    strategy:
      matrix:
        defines:
          - ""
    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Report runner architecture.
        run: |
          echo "uname -m: $(uname -m)"
          echo "cpu: $(sysctl -n machdep.cpu.brand_string)"
          test "$(uname -m)" = "arm64" || {
            echo "::error::Runner is $(uname -m), not arm64; this lane only produces Apple Silicon builds."
            exit 1
          }

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: Verify Telegramd identity contract.
        run: bash "$REPO_NAME/Telegram/build/test_mac_identity.sh" "$REPO_NAME" identity

      - name: First set up.
        run: |
          sudo chown -R `whoami`:admin /usr/local/share

          brew update
          brew upgrade || true
          brew install automake libtool meson nasm ninja pkg-config

          # Disable spotlight.
          sudo mdutil -a -i off

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Libraries.
        id: libraries
        run: |
          ./$REPO_NAME/Telegram/build/prepare/mac.sh skip-release silent

      - name: Free up some disk space.
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      # Saved only from the default branch. Every other ref reads that entry
      # instead of writing its own: the fork's Actions cache is already over
      # its 10 GB budget and evicting, and any other copy of this tree would
      # evict the entry the whole fork builds against. A tag ref would be the
      # worst of those, since its cache is scoped to the tag and no branch,
      # including dev, can ever restore it.
      # Placed before the build step, so an hour of dependency work is not
      # thrown away when the client code that follows fails to compile.
      # !cancelled() rather than always(): under cancel-in-progress a
      # cancellation can land mid-trim, and this key is immutable, so a
      # half-trimmed tree would be the one every later run restores.
      - name: Save libraries cache.
        if: ${{ !cancelled() && steps.libraries.outcome == 'success' && steps.cache-libs.outputs.cache-hit != 'true' && github.ref == 'refs/heads/dev' }}
        uses: actions/cache/save@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}

      - name: Telegramd build.
        id: build
        if: env.ONLY_CACHE == 'false'
        run: |
          cd $REPO_NAME/Telegram

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo Define from matrix: $DEFINE
            echo "ARTIFACT_NAME=Telegramd-macOS-arm64 ${{ matrix.defines }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=Telegramd-macOS-arm64" >> $GITHUB_ENV
          fi

          # cmake/validate_special_target.cmake defaults this to "x86_64;arm64",
          # so the inherited build spent half its compile time on a slice no one
          # here can run. The prepared Libraries are universal, so linking an
          # arm64-only client against them needs nothing else.
          ./configure.sh \
          -D CMAKE_OSX_ARCHITECTURES=arm64 \
          -D CMAKE_CONFIGURATION_TYPES=Debug \
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON \
          -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -D TDESKTOP_API_TEST=ON \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF \
          $DEFINE

          grep -F 'DESKTOP_APP_DISABLE_AUTOUPDATE:BOOL=ON' ../out/CMakeCache.txt
          cmake --build ../out --config Debug --parallel

      - name: Verify artifact architecture.
        id: artifact-verification
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          set -Eeuo pipefail
          cd $REPO_NAME/out/Debug
          mkdir -p evidence
          evidence_dir="$PWD/evidence"
          static_failure() {
            code=$?
            trap - EXIT
            if [ "$code" -ne 0 ]; then
              printf 'FAIL: static artifact verification exit_code=%s command=%s\n' "$code" "${BASH_COMMAND:-unknown}" > "$evidence_dir/status.txt"
            fi
            exit "$code"
          }
          trap static_failure EXIT
          grep -F 'DESKTOP_APP_DISABLE_AUTOUPDATE:BOOL=ON' ../CMakeCache.txt | tee evidence/cmake-cache-autoupdate.txt
          app=Telegramd.app
          plist="$app/Contents/Info.plist"
          executable="$app/Contents/MacOS/Telegramd"
          plutil -p "$plist" | tee evidence/plist.txt
          test "$(plutil -extract CFBundleExecutable raw -o - "$plist")" = Telegramd
          test "$(plutil -extract CFBundleName raw -o - "$plist")" = Telegramd
          test "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = com.adambenhassen.telegramd
          if plutil -extract CFBundleURLTypes xml1 -o - "$plist" >/dev/null 2>&1; then
            echo "CFBundleURLTypes must be absent from $plist"
            exit 1
          fi
          test ! -e "$app/Contents/Frameworks/Updater"
          test ! -e Updater
          test ! -e "$app/Contents/Helpers/Updater"
          if find "$app" -type f -perm -111 -iname 'Updater' -print -quit | grep -q .; then
            echo "recursive updater search found an executable"
            exit 1
          fi
          for binary in "$executable"; do
            echo "== $binary"
            file "$binary"
            archs=$(lipo -archs "$binary")
            echo "lipo -archs: $archs"
            test "$archs" = "arm64" || {
              echo "::error::$binary is '$archs', expected arm64."
              exit 1
            }
          done | tee evidence/architecture-static.txt

      - name: Run isolation observer self-tests (informational).
        if: ${{ always() && env.UPLOAD_ARTIFACT == 'true' }}
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          evidence="$REPO_NAME/out/Debug/evidence"
          mkdir -p "$evidence"
          bash "$REPO_NAME/Telegram/build/test_mac_identity.sh" "$REPO_NAME" observer \
            2>&1 | tee "$evidence/observer-self-tests.txt"

      - name: Classify Telegramd artifact publication.
        if: always()
        run: |
          set -u
          evidence="$REPO_NAME/out/Debug/evidence"
          mkdir -p "$evidence"
          ready=false
          if [ "${{ steps.build.outcome }}" = "success" ] \
            && [ "${{ steps.artifact-verification.outcome }}" = "success" ]; then
            ready=true
          fi
          printf 'artifact_ready=%s\n' "$ready" > "$evidence/artifact-publication.txt"
          echo "ARTIFACT_READY=$ready" >> "$GITHUB_ENV"

      - name: Move artifact.
        if: always() && env.UPLOAD_ARTIFACT == 'true' && env.ARTIFACT_READY == 'true'
        run: |
          cd $REPO_NAME/out/Debug
          mkdir artifact
          if [ -d Telegramd.app ]; then
            mv Telegramd.app artifact/
          fi
      - uses: actions/upload-artifact@v7
        if: always() && env.UPLOAD_ARTIFACT == 'true' && env.ARTIFACT_READY == 'true'
        name: Upload artifact.
        with:
          name: Telegramd-macOS-arm64
          path: ${{ env.REPO_NAME }}/out/Debug/artifact/
          if-no-files-found: error

      - name: Package release asset.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && env.ARTIFACT_READY == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          artifact_dir="$REPO_NAME/out/Debug/artifact"
          asset_tag="${RELEASE_TAG//\//-}"
          asset_name="Telegramd-macOS-arm64-${asset_tag}.zip"
          (
            cd "$artifact_dir"
            zip -r "../$asset_name" Telegramd.app
          )
          release_asset="$REPO_NAME/out/Debug/$asset_name"
          release_asset_sha256="$(shasum -a 256 "$release_asset" | awk '{print $1}')"
          echo "RELEASE_ASSET=$release_asset" >> "$GITHUB_ENV"
          echo "RELEASE_ASSET_SHA256=$release_asset_sha256" >> "$GITHUB_ENV"
          printf 'release_asset_sha256=%s\n' "$release_asset_sha256" \
            > "$REPO_NAME/out/Debug/evidence/release-asset-sha256.txt"

      - name: Save Telegramd evidence.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Telegramd-macOS-arm64-evidence
          path: ${{ env.REPO_NAME }}/out/Debug/evidence/
          if-no-files-found: warn

      - name: Publish GitHub release.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && env.ARTIFACT_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ASSET_SHA256: ${{ env.RELEASE_ASSET_SHA256 }}
        run: |
          set -euo pipefail
          notes=$(printf 'Tag: %s\nCommit: %s\nArchive SHA-256: %s\n\nThis app is unsigned and must be opened once via right-click > Open.' "$RELEASE_TAG" "$RELEASE_SHA" "$RELEASE_ASSET_SHA256")
          release_repo="$GITHUB_REPOSITORY"
          is_prerelease=false
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            is_prerelease=true
          fi

          if ! gh release view "$RELEASE_TAG" --repo "$release_repo" >/dev/null 2>&1; then
            create_args=(--verify-tag --draft)
            if [[ "$is_prerelease" == true ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$release_repo" \
              --title "$RELEASE_TAG" \
              --notes "$notes" \
              "${create_args[@]}"
          elif [[ "$(gh release view "$RELEASE_TAG" --repo "$release_repo" --json isDraft --jq .isDraft)" != true ]]; then
            echo "Refusing to update an already-published release." >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" \
            --repo "$release_repo" \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --repo "$release_repo" \
            --title "$RELEASE_TAG" \
            --notes "$notes" \
            --draft

  auth-startup-regression:
    name: macOS auth lifecycle and persisted-startup socket regression
    needs: validate-auth-regression-inputs
    if: ${{ needs.validate-auth-regression-inputs.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.auth_regression_sha != '' && inputs.auth_regression_build_run_id != '' }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: macos-latest
    timeout-minutes: 40

    env:
      CANDIDATE_SHA: ${{ inputs.auth_regression_sha }}
      BUILD_RUN_ID: ${{ inputs.auth_regression_build_run_id }}

    steps:
      - name: Initialize evidence.
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/main-1066-auth-startup-evidence"
          mkdir -p "$EVIDENCE_DIR"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"

      - name: Report runner architecture.
        run: |
          echo "uname -m: $(uname -m)"
          echo "cpu: $(sysctl -n machdep.cpu.brand_string)"
          test "$(uname -m)" = "arm64" || {
            echo "::error::Regression evidence requires the Apple Silicon runner."
            exit 1
          }

      - name: Checkout verification workflow source.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: workflow-source
          persist-credentials: false

      - name: Checkout exact candidate source.
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.auth_regression_sha }}
          path: candidate-source
          persist-credentials: false

      - name: Verify live candidate and successful app artifact run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          live_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/74" --jq .head.sha)"
          live_state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/74" --jq .state)"
          live_base="$(gh api "repos/$GITHUB_REPOSITORY/pulls/74" --jq .base.ref)"
          run_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq .head_sha)"
          run_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq .status)"
          run_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq .conclusion)"
          run_path="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq .path)"

          test "$live_head" = "$CANDIDATE_SHA" || {
            echo "::error::PR 74 moved: expected $CANDIDATE_SHA, live head is $live_head."
            exit 1
          }
          test "$live_state" = "open"
          test "$live_base" = "dev"
          test "$run_sha" = "$CANDIDATE_SHA"
          test "$run_status" = "completed"
          test "$run_conclusion" = "success"
          test "$run_path" = ".github/workflows/mac.yml"

          candidate_checkout="$(git -C candidate-source rev-parse HEAD)"
          test "$candidate_checkout" = "$CANDIDATE_SHA"
          contract="candidate-source/Telegram/SourceFiles/tests/auth_startup_regression.md"
          test -f "$contract"

          {
            echo "tested_sha=$CANDIDATE_SHA"
            echo "candidate_pr=74"
            echo "candidate_build_run_id=$BUILD_RUN_ID"
            echo "candidate_build_run_sha=$run_sha"
            echo "candidate_build_run_conclusion=$run_conclusion"
            echo "candidate_checkout_sha=$candidate_checkout"
            echo "fixture_contract_sha256=$(shasum -a 256 "$contract" | awk '{print $1}')"
          } | tee "$EVIDENCE_DIR/candidate.txt"

      - name: Download exact-head arm64 app artifact.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name Telegramd-macOS-arm64 \
            --dir "$RUNNER_TEMP/candidate-artifact"
          app="$(find "$RUNNER_TEMP/candidate-artifact" \
            -type f -path '*/Contents/MacOS/Telegramd' -print -quit)"
          test -n "$app"
          test -x "$app"
          archs="$(lipo -archs "$app")"
          test "$archs" = "arm64"
          echo "app_path=$app" | tee -a "$EVIDENCE_DIR/candidate.txt"
          echo "app_archs=$archs" | tee -a "$EVIDENCE_DIR/candidate.txt"
          echo "APP_PATH=$app" >> "$GITHUB_ENV"

      - name: Run lifecycle and persisted-startup regressions under socket observation.
        run: |
          set -euo pipefail
          python3 workflow-source/.github/scripts/run_mac_auth_startup_regression.py \
            "$APP_PATH" "$CANDIDATE_SHA" "$EVIDENCE_DIR"

      - name: Reconfirm live candidate head after runtime checks.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          live_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/74" --jq .head.sha)"
          live_state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/74" --jq .state)"
          live_base="$(gh api "repos/$GITHUB_REPOSITORY/pulls/74" --jq .base.ref)"
          {
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "final_live_head=$live_head"
            echo "final_state=$live_state"
            echo "final_base=$live_base"
          } | tee "$EVIDENCE_DIR/candidate-head-final.txt"
          test "$live_head" = "$CANDIDATE_SHA"
          test "$live_state" = "open"
          test "$live_base" = "dev"

      - name: Upload lifecycle and socket evidence.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macOS-auth-startup-socket-evidence
          path: ${{ runner.temp }}/main-1066-auth-startup-evidence/
          if-no-files-found: warn
          retention-days: 30
