name: MacOS.

on:
  # Fork policy: per-push CI is Linux only. macOS builds on demand or for a release tag.
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  macos:
    name: MacOS
    permissions:
      contents: write
    # This fork cannot schedule a depot label, and a build that queues forever
    # is not a build. macos-latest is Apple Silicon, which is what we ship.
    runs-on: macos-latest

    strategy:
      matrix:
        defines:
          - ""
    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Report runner architecture.
        run: |
          echo "uname -m: $(uname -m)"
          echo "cpu: $(sysctl -n machdep.cpu.brand_string)"
          test "$(uname -m)" = "arm64" || {
            echo "::error::Runner is $(uname -m), not arm64; this lane only produces Apple Silicon builds."
            exit 1
          }

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          sudo chown -R `whoami`:admin /usr/local/share

          brew update
          brew upgrade || true
          brew install automake libtool meson nasm ninja pkg-config

          # Disable spotlight.
          sudo mdutil -a -i off

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Libraries.
        id: libraries
        run: |
          ./$REPO_NAME/Telegram/build/prepare/mac.sh skip-release silent

      - name: Free up some disk space.
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      # Saved only from the default branch. Every other ref reads that entry
      # instead of writing its own: the fork's Actions cache is already over
      # its 10 GB budget and evicting, and any other copy of this tree would
      # evict the entry the whole fork builds against. A tag ref would be the
      # worst of those, since its cache is scoped to the tag and no branch,
      # including dev, can ever restore it.
      # Placed before the build step, so an hour of dependency work is not
      # thrown away when the client code that follows fails to compile.
      # !cancelled() rather than always(): under cancel-in-progress a
      # cancellation can land mid-trim, and this key is immutable, so a
      # half-trimmed tree would be the one every later run restores.
      - name: Save libraries cache.
        if: ${{ !cancelled() && steps.libraries.outcome == 'success' && steps.cache-libs.outputs.cache-hit != 'true' && github.ref == 'refs/heads/dev' }}
        uses: actions/cache/save@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd $REPO_NAME/Telegram

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo Define from matrix: $DEFINE
            echo "ARTIFACT_NAME=Telegram-macOS-arm64 ${{ matrix.defines }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=Telegram-macOS-arm64" >> $GITHUB_ENV
          fi

          # cmake/validate_special_target.cmake defaults this to "x86_64;arm64",
          # so the inherited build spent half its compile time on a slice no one
          # here can run. The prepared Libraries are universal, so linking an
          # arm64-only client against them needs nothing else.
          ./configure.sh \
          -D CMAKE_OSX_ARCHITECTURES=arm64 \
          -D CMAKE_CONFIGURATION_TYPES=Debug \
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON \
          -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -D TDESKTOP_API_TEST=ON \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF \
          $DEFINE

          cmake --build ../out --config Debug --parallel

      - name: Verify artifact architecture.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          cd $REPO_NAME/out/Debug
          for binary in Telegram.app/Contents/MacOS/Telegram Updater; do
            echo "== $binary"
            file "$binary"
            archs=$(lipo -archs "$binary")
            echo "lipo -archs: $archs"
            test "$archs" = "arm64" || {
              echo "::error::$binary is '$archs', expected arm64."
              exit 1
            }
          done

      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          cd $REPO_NAME/out/Debug
          mkdir artifact
          mv Telegram.app artifact/
          mv Updater artifact/
      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload artifact.
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.REPO_NAME }}/out/Debug/artifact/

      - name: Package release asset.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          artifact_dir="$REPO_NAME/out/Debug/artifact"
          asset_tag="${RELEASE_TAG//\//-}"
          asset_name="Telegram-macOS-arm64-${asset_tag}.zip"
          (
            cd "$artifact_dir"
            zip -r "../$asset_name" Telegram.app Updater
          )
          echo "RELEASE_ASSET=$REPO_NAME/out/Debug/$asset_name" >> "$GITHUB_ENV"

      - name: Publish GitHub release.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          notes=$(printf 'Tag: %s\nCommit: %s\n\nThis app is unsigned and must be opened once via right-click > Open.' "$RELEASE_TAG" "$RELEASE_SHA")
          release_repo="$GITHUB_REPOSITORY"
          is_prerelease=false
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            is_prerelease=true
          fi

          if ! gh release view "$RELEASE_TAG" --repo "$release_repo" >/dev/null 2>&1; then
            create_args=(--verify-tag --draft)
            if [[ "$is_prerelease" == true ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$release_repo" \
              --title "$RELEASE_TAG" \
              --notes "$notes" \
              "${create_args[@]}"
          fi

          # Upload before publishing so an interrupted run leaves only a draft.
          gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" \
            --repo "$release_repo" \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --repo "$release_repo" \
            --title "$RELEASE_TAG" \
            --notes "$notes" \
            --draft=false \
            --prerelease="$is_prerelease"
