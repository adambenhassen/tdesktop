name: Docker.

on:
  push:
    paths:
      - '.github/workflows/docker.yml'
      - 'Telegram/build/docker/centos_env/**'
      # Runs inside the image, is not baked into it, and is bind-mounted from
      # the checkout at run time. Rebuilding the toolchain from source and
      # republishing centos_env:latest for it would hand every lane that pulls
      # that tag a differently-built image for a change it cannot observe.
      - '!Telegram/build/docker/centos_env/build_tests.sh'

concurrency:
  # This group serialises, it does not cancel. The job below runs only on the
  # default branch and its last step pushes centos_env:latest unconditionally,
  # so two rapid pushes would otherwise race for that tag and the older build
  # could win it. cancel-in-progress stays false on the default branch for
  # exactly that reason: the second run pends until the first has published.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  docker:
    name: Ubuntu
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch

    env:
      IMAGE_TAG: ghcr.io/${{ github.repository }}/centos_env:latest

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: First set up.
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Docker image build.
        run: |
          cd Telegram/build/docker/centos_env
          poetry install
          DEBUG= LTO= poetry run gen_dockerfile | DOCKER_BUILDKIT=1 docker build -t $IMAGE_TAG -

      - name: Push the Docker image.
        run: docker push $IMAGE_TAG
