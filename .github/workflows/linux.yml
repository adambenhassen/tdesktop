name: Linux.

on:
  push:
    # Pull requests provide feature-branch validation. A direct push without an
    # open pull request gets no automatic Linux feedback; use workflow_dispatch
    # for that opt-in validation.
    branches:
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/linux.yml'
      - 'snap/**'
      - 'Telegram/build/**'
      - '!Telegram/build/docker/centos_env/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.bat'
      - 'Telegram/Telegram.plist'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/linux.yml'
      - 'snap/**'
      - 'Telegram/build/**'
      - '!Telegram/build/docker/centos_env/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.bat'
      - 'Telegram/Telegram.plist'
  # Keeps the default branch holding a live ccache for feature branches to restore
  # from, instead of leaving it to whenever someone last pushed to it. The restore
  # refreshes the entry's 7-day expiry; the save below only fires when the build
  # actually missed, so a quiet day costs nothing.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  # One live build per branch and pull request. A new pull-request update
  # supersedes its prior run. The default branch is exempt so a cache-refreshing
  # build always finishes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:

  linux:
    name: Rocky Linux 8
    runs-on: ubuntu-latest

    strategy:
      matrix:
        defines:
          - ""

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      IMAGE_TAG: tdesktop:centos_env
      # The dependency image and its BuildKit cache need headroom beyond the
      # checked-out tree. Reclaim the runner only when less than this amount
      # remains, and fail closed if the headroom cannot be confirmed.
      MIN_FREE_SPACE_GIB: "30"

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check free disk space before image preparation.
        id: disk-space-before
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${MIN_FREE_SPACE_GIB}" =~ ^[0-9]+$ ]]; then
            echo "::error::MIN_FREE_SPACE_GIB is not a non-negative integer: ${MIN_FREE_SPACE_GIB}"
            exit 1
          fi
          minimum_kib=$((MIN_FREE_SPACE_GIB * 1024 * 1024))

          if ! free_kib=$(df -Pk / | awk 'NR == 2 { print $4; exit }'); then
            echo "::error::Unable to measure free disk space on the runner."
            exit 1
          fi
          if [[ ! "${free_kib}" =~ ^[0-9]+$ ]]; then
            echo "::error::Free disk space measurement was unavailable: '${free_kib}'"
            exit 1
          fi

          free_gib=$((free_kib / 1024 / 1024))
          echo "Free disk space before image preparation: ${free_gib} GiB (${free_kib} KiB). Minimum: ${MIN_FREE_SPACE_GIB} GiB (${minimum_kib} KiB)."
          echo "free_kib=${free_kib}" >> "${GITHUB_OUTPUT}"
          if (( free_kib < minimum_kib )); then
            echo "cleanup_required=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::Disk cleanup required: ${free_gib} GiB is below the ${MIN_FREE_SPACE_GIB} GiB minimum."
          else
            echo "cleanup_required=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Disk cleanup skipped: ${free_gib} GiB is at or above the ${MIN_FREE_SPACE_GIB} GiB minimum."
          fi

      - name: Free up some disk space when needed.
        if: steps.disk-space-before.outputs.cleanup_required == 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Verify free disk space after cleanup.
        if: steps.disk-space-before.outputs.cleanup_required == 'true'
        id: disk-space-after
        shell: bash
        run: |
          set -euo pipefail

          minimum_kib=$((MIN_FREE_SPACE_GIB * 1024 * 1024))
          if ! free_kib=$(df -Pk / | awk 'NR == 2 { print $4; exit }'); then
            echo "::error::Unable to measure free disk space after cleanup."
            exit 1
          fi
          if [[ ! "${free_kib}" =~ ^[0-9]+$ ]]; then
            echo "::error::Free disk space measurement after cleanup was unavailable: '${free_kib}'"
            exit 1
          fi

          free_gib=$((free_kib / 1024 / 1024))
          echo "Free disk space after cleanup: ${free_gib} GiB (${free_kib} KiB). Minimum: ${MIN_FREE_SPACE_GIB} GiB (${minimum_kib} KiB)."
          echo "free_kib=${free_kib}" >> "${GITHUB_OUTPUT}"
          if (( free_kib < minimum_kib )); then
            echo "::error::Free disk space remains below the ${MIN_FREE_SPACE_GIB} GiB minimum after cleanup."
            exit 1
          fi

      - name: First set up.
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
          | sudo tar xJ -C /usr/local/bin --strip-components=1 ccache-4.13.6-linux-x86_64-glibc/ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> $GITHUB_ENV
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Verify free disk space before dependency image build.
        shell: bash
        run: |
          set -euo pipefail

          minimum_kib=$((MIN_FREE_SPACE_GIB * 1024 * 1024))
          if ! free_kib=$(df -Pk / | awk 'NR == 2 { print $4; exit }'); then
            echo "::error::Unable to measure free disk space before the dependency image build."
            exit 1
          fi
          if [[ ! "${free_kib}" =~ ^[0-9]+$ ]]; then
            echo "::error::Free disk space measurement before the dependency image build was unavailable: '${free_kib}'"
            exit 1
          fi

          free_gib=$((free_kib / 1024 / 1024))
          echo "Free disk space before dependency image build: ${free_gib} GiB (${free_kib} KiB). Minimum: ${MIN_FREE_SPACE_GIB} GiB (${minimum_kib} KiB)."
          if (( free_kib < minimum_kib )); then
            echo "::error::Free disk space fell below the ${MIN_FREE_SPACE_GIB} GiB minimum before the dependency image build."
            exit 1
          fi

      - name: Set up Docker Buildx.
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      # Split by branch for the same reason as the ccache below: an entry written
      # from a feature branch is scoped to that branch, so no other branch can ever
      # read it, and it still counts against the repository's 10 GB budget. Three
      # such copies were evicting the entry the default branch depends on. Feature
      # branches restore only; the default branch keeps the full action, whose
      # post-job save is what captures the mount cache the dance step extracts.
      - name: Libraries cache.
        id: cache-libs
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.OS }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Libraries cache (restore only).
        id: restore-libs
        if: github.ref_name != github.event.repository.default_branch
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.OS }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Restore Docker cache mounts.
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/.mount-cache
          dockerfile: Telegram/build/docker/centos_env/Dockerfile
          skip-extraction: ${{ steps.cache-libs.outputs.cache-hit == 'true' || steps.restore-libs.outputs.cache-hit == 'true' }}

      - name: Libraries.
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: ${{ env.ONLY_CACHE == 'false' }}
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache.
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache{-new,}

      - name: Restore Telegram Desktop cache.
        id: cache-tdesktop
        if: env.ONLY_CACHE == 'false'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.OS }}-tdesktop-${{ matrix.defines || 'null' }}-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}-tdesktop-${{ matrix.defines || 'null' }}-

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo Define from matrix: $DEFINE
            echo "ARTIFACT_NAME=Telegram ${{ matrix.defines }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=Telegram" >> $GITHUB_ENV
          fi

          ccache -z

          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
          -e CONFIG=Debug \
          -e CCACHE_SLOPPINESS=pch_defines,time_macros \
          $IMAGE_TAG \
          env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES=Debug \
          -D CMAKE_C_FLAGS_DEBUG="-O0 -fpch-preprocess" \
          -D CMAKE_CXX_FLAGS_DEBUG="-O0 -fpch-preprocess" \
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON \
          -D TDESKTOP_API_TEST=ON \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF \
          $DEFINE

      - name: Count ccache misses.
        id: ccache-stats
        if: env.ONLY_CACHE == 'false'
        run: |
          MISSES=$(ccache --print-stats | sed -n 's/^cache_miss\t//p' | head -1)
          case "$MISSES" in (*[!0-9]*|'') MISSES=0;; esac
          echo "misses=$MISSES" >> $GITHUB_OUTPUT
          echo "ccache misses this run: $MISSES"

      - name: Trim Telegram Desktop cache.
        if: >
          env.ONLY_CACHE == 'false'
            && github.ref_name == github.event.repository.default_branch
            && fromJSON(steps.ccache-stats.outputs.misses) > 300
        run: ccache --evict-older-than 1d

      - name: Save Telegram Desktop cache.
        if: >
          env.ONLY_CACHE == 'false'
            && github.ref_name == github.event.repository.default_branch
            && fromJSON(steps.ccache-stats.outputs.misses) > 300
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-tdesktop.outputs.cache-primary-key }}

      - name: Check.
        if: env.ONLY_CACHE == 'false'
        run: |
          filePath="out/Debug/Telegram"
          if test -f "$filePath"; then
            echo "Build successfully done! :)"

            size=$(stat -c %s "$filePath")
            echo "File size of ${filePath}: ${size} Bytes."
          else
            echo "Build error, output file does not exist."
            exit 1
          fi

      # Runs in the same image the client was built in, so the test binary
      # links against the libraries it was compiled against. The build above
      # already produced it, so this only executes it: seconds, not a second
      # compile. Placed before the artifact steps so a red test stops the
      # upload rather than shipping a binary nothing checked.
      # Telegramd ships for macOS, so Linux CI gates the standalone unit cases
      # without running the desktop GUI regression under Xvfb.
      - name: Unit tests.
        if: env.ONLY_CACHE == 'false'
        run: |
          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          $IMAGE_TAG \
          bash -lc '
            cd /usr/src/tdesktop
            /usr/src/tdesktop/out/Debug/test_unit
            TEST_STATUS=$?
            if test "$TEST_STATUS" -ne 0; then
              exit "$TEST_STATUS"
            fi
          '

      - name: Clean-process network isolation.
        if: env.ONLY_CACHE == 'false'
        env:
          REVIEWED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          umask 077

          evidence_dir="$PWD/out/Debug/evidence/network-isolation"
          mkdir -p "$evidence_dir"
          {
            printf 'event_name=%s\n' "$GITHUB_EVENT_NAME"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'workflow_sha=%s\n' "$GITHUB_SHA"
            printf 'reviewed_head_sha=%s\n' "$REVIEWED_HEAD_SHA"
            printf 'head_ref=%s\n' "$GITHUB_HEAD_REF"
          } > "$evidence_dir/run-context.txt"

          docker run --rm -i \
            -u "$(id -u)" \
            --network none \
            --cap-add=SYS_PTRACE \
            -v "$PWD:/usr/src/tdesktop" \
            "$IMAGE_TAG" \
            bash -s <<'TRACE_RUN'
          set -Eeuo pipefail
          cd /usr/src/tdesktop

          evidence_dir=/usr/src/tdesktop/out/Debug/evidence/network-isolation
          runner=/usr/src/tdesktop/Telegram/build/network_isolation_test.sh
          binary=/usr/src/tdesktop/out/Debug/Telegram
          summary="$evidence_dir/run-summary.txt"
          expected_cases=16
          expected_case_names=(
            fresh-empty
            malformed-selection
            canceled-selection
            failed-selection
            partial-selection
            timed-out-selection
            public-selection
            public-failure
            local-preflight
            pinned-endpoint
            restart-pinned
            multiple-account-isolation
            proxy-intermediary
            background-refresh
            selected-endpoint-failure
            late-callback
          )

          : > "$summary"
          printf 'expected_cases=%s\n' "$expected_cases" >> "$summary"
          case_rows="$("$runner" --list-cases)"
          listed_cases="$(printf '%s\n' "$case_rows" | awk 'NF { count++ } END { print count + 0 }')"
          listed_case_names=()
          while IFS=$'\t' read -r case_name _; do
            [[ -n "$case_name" ]] || continue
            listed_case_names+=("$case_name")
          done <<< "$case_rows"
          expected_sorted="$(printf '%s\n' "${expected_case_names[@]}" | sort)"
          listed_sorted="$(printf '%s\n' "${listed_case_names[@]}" | sort)"
          manifest_matches_expected=0
          if [[ "$expected_sorted" == "$listed_sorted" ]]; then
            manifest_matches_expected=1
          fi

          printf 'listed_cases=%s\n' "$listed_cases" >> "$summary"
          printf 'manifest_matches_expected=%s\n' "$manifest_matches_expected" >> "$summary"

          executed_cases=0
          passed_cases=0
          failed_cases=0
          while IFS=$'\t' read -r case_name _; do
            [[ -n "$case_name" ]] || continue
            if [[ ! "$case_name" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              failed_cases=$((failed_cases + 1))
              printf 'case=invalid-name status=FAIL\n' >> "$summary"
              continue
            fi
            executed_cases=$((executed_cases + 1))
            case_evidence="$evidence_dir/$case_name"
            mkdir -p "$case_evidence"
            if "$runner" \
              --case "$case_name" \
              --evidence-dir "$case_evidence" \
              -- "$binary"; then
              passed_cases=$((passed_cases + 1))
              printf 'case=%s status=PASS\n' "$case_name" >> "$summary"
            else
              case_status=$?
              failed_cases=$((failed_cases + 1))
              printf 'case=%s status=FAIL exit=%s\n' \
                "$case_name" "$case_status" >> "$summary"
            fi
          done <<< "$case_rows"

          printf 'executed_cases=%s\n' "$executed_cases" >> "$summary"
          printf 'passed_cases=%s\n' "$passed_cases" >> "$summary"
          printf 'failed_cases=%s\n' "$failed_cases" >> "$summary"

          if (( listed_cases != expected_cases \
            || manifest_matches_expected != 1 \
            || executed_cases != expected_cases \
            || passed_cases != expected_cases \
            || failed_cases != 0 )); then
            echo "FAIL: expected and passed all $expected_cases network trace cases" >&2
            exit 1
          fi
          echo "PASS: all $expected_cases network trace cases"
          TRACE_RUN

      - name: Upload network isolation evidence.
        if: always() && env.ONLY_CACHE == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: network-isolation-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            out/Debug/evidence/network-isolation/run-context.txt
            out/Debug/evidence/network-isolation/run-summary.txt
            out/Debug/evidence/network-isolation/*/allowed-*.txt
            out/Debug/evidence/network-isolation/*/command.txt
            out/Debug/evidence/network-isolation/*/network-report.json
            out/Debug/evidence/network-isolation/*/network-report.stdout.json
            out/Debug/evidence/network-isolation/*/observer.txt
            out/Debug/evidence/network-isolation/*/process-status.txt
            out/Debug/evidence/network-isolation/*/status.txt

      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          cd out/Debug
          mkdir artifact
          mv {Telegram,Updater} artifact/
      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload artifact.
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/Debug/artifact/
