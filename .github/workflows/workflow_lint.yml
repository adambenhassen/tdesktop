name: Workflow lint.

on:
  # The build lanes other than Linux are workflow_dispatch-only, so a broken
  # expression in one of them would otherwise surface only when somebody
  # dispatches it. Lint the whole directory whenever any of it changes.
  push:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - '.github/scripts/ccache_save_decision.sh'
      - '.github/scripts/test_ccache_save_decision.sh'
      - '.github/scripts/ccache_miss_count.sh'
      - '.github/scripts/test_ccache_miss_count.sh'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - '.github/scripts/ccache_save_decision.sh'
      - '.github/scripts/test_ccache_save_decision.sh'
      - '.github/scripts/ccache_miss_count.sh'
      - '.github/scripts/test_ccache_miss_count.sh'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:

  actionlint:
    name: actionlint
    runs-on: ubuntu-26.04

    env:
      ACTIONLINT_VERSION: "1.7.7"
      ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"

    steps:
      - name: Clone.
        uses: actions/checkout@v4

      - name: Install actionlint.
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -O \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" actionlint
          rm -f "${archive}"

      - name: Lint every workflow file.
        run: |
          set -euo pipefail
          # shellcheck and pyflakes are switched off: they report ~80 findings in
          # `run:` bodies inherited from upstream, which would leave the check red
          # from day one. What is linted is workflow syntax, expressions, action
          # inputs and runner labels.
          ./actionlint -color -shellcheck= -pyflakes=

      - name: Test ccache save decision.
        run: bash .github/scripts/test_ccache_save_decision.sh

      - name: Test ccache miss count.
        run: bash .github/scripts/test_ccache_miss_count.sh

  ccache-helpers-macos:
    name: ccache helpers (macOS)
    runs-on: macos-latest

    steps:
      - name: Clone.
        uses: actions/checkout@v4

      - name: Test compiler cache helpers.
        run: |
          set -euo pipefail
          bash .github/scripts/test_ccache_save_decision.sh
          bash .github/scripts/test_ccache_miss_count.sh
